name: content-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nada do jogo no repositório
        run: python3 tools/check_content.py --all
      - name: Testes sem dados do jogo
        run: python3 -m unittest discover -s tests -v
